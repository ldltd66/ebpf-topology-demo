apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive-service
  namespace: ebpf-demo
spec:
  replicas: 2
  revisionHistoryLimit: 1  # 只保留 1 个历史 RS，避免旧 RS 引用旧镜像导致 prune 删不掉
  selector:
    matchLabels:
      app: archive-service
  template:
    metadata:
      labels:
        app: archive-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: app
          image: crpi-ievhl527wmnxwc88.cn-beijing.personal.cr.aliyuncs.com/ldltd/ebpf-archive-service@sha256:2d89fbce4c8974406772a15b02728e02d9934409d278f6b22216226cff116732  # CI 用 kubectl set image 覆盖为 SHA tag
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "archive-service"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: archive-service
  namespace: ebpf-demo
spec:
  selector:
    app: archive-service
  ports:
    - port: 8080
      targetPort: 8080
      appProtocol: http
