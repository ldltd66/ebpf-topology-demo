apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: ebpf-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: app
          image: crpi-ievhl527wmnxwc88.cn-beijing.personal.cr.aliyuncs.com/ldltd/ebpf-risk-engine:latest
          ports:
            - containerPort: 8080
          env:
            - name: TRADE_CALLBACK_URL
              value: "http://trade-service:8080/api/trade/callback"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "risk-engine"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: ebpf-demo
spec:
  selector:
    app: risk-engine
  ports:
    - port: 8080
      targetPort: 8080
      appProtocol: http
