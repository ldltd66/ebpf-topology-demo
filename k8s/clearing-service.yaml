apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-service
  namespace: ebpf-demo
spec:
  replicas: 2
  revisionHistoryLimit: 1  # 只保留 1 个历史 RS，避免旧 RS 引用旧镜像导致 prune 删不掉
  selector:
    matchLabels:
      app: clearing-service
  template:
    metadata:
      labels:
        app: clearing-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: app
          image: crpi-ievhl527wmnxwc88.cn-beijing.personal.cr.aliyuncs.com/ldltd/ebpf-clearing-service@sha256:c99e6833482bdb1736bb4df90e5f90d351dce02fb15da7ff255ba19ddd6458f7  # CI 用 kubectl set image 覆盖为 SHA tag
          ports:
            - containerPort: 8080
          env:
            - name: TRADE_CALLBACK_URL
              value: "http://trade-service:8080/api/trade/callback"
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service:8080"
            - name: ARCHIVE_SERVICE_URL
              value: "http://archive-service:8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "clearing-service"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: clearing-service
  namespace: ebpf-demo
spec:
  selector:
    app: clearing-service
  ports:
    - port: 8080
      targetPort: 8080
      appProtocol: http
