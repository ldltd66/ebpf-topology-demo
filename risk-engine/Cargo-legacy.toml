[package]
name = "risk-engine"
version = "0.1.0"
edition = "2021"

# ── Legacy build: Rust 1.70 compatible ──────────────────────────────────────
# Stripped down: only /api/flow (terminal) + /api/risk-check (callback via raw TCP)
# No reqwest/tonic (they pull ICU/indexmap deps requiring Rust 2024 edition)

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
