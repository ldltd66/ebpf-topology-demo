[package]
name = "risk-engine"
version = "0.1.0"
edition = "2021"

# ── Legacy build: Rust 1.70 compatible ──────────────────────────────────────
# Use this file instead of Cargo.toml when targeting Rust 1.70 (June 2023).
# Key downgrades:
#   axum    0.7 → 0.6   (axum::serve → axum::Server)
#   tonic   0.11 → 0.9  (lower MSRV)
#   prost   0.12 → 0.11 (matches tonic 0.9)
#   reqwest 0.12 → 0.11 (lower MSRV)

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.9"
prost = "0.11"

[build-dependencies]
tonic-build = "0.9"
