server:
  port: 8080

spring:
  application:
    name: trade-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.example.trade: INFO
    root: INFO

# gRPC client config for grpc-client-spring-boot-starter
grpc:
  client:
    risk-service:
      address: 'static://${RISK_SERVICE_GRPC:risk-service:50051}'
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: PLAINTEXT

app:
  risk-service-url: ${RISK_SERVICE_URL:http://risk-service:8080}
  clearing-service-url: ${CLEARING_SERVICE_URL:http://clearing-service:8080}
  audit-service-url: ${AUDIT_SERVICE_URL:http://audit-service:8080}
  risk-engine-url: ${RISK_ENGINE_URL:http://risk-engine:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
