name: Build and Deploy eBPF Topology Demo

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'trade-service/**'
      - 'risk-service/**'
      - 'clearing-service/**'
      - 'risk-engine/**'
      - 'audit-service/**'
      - 'archive-service/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      trade-service: ${{ steps.changes.outputs.trade-service }}
      risk-service: ${{ steps.changes.outputs.risk-service }}
      clearing-service: ${{ steps.changes.outputs.clearing-service }}
      risk-engine: ${{ steps.changes.outputs.risk-engine }}
      audit-service: ${{ steps.changes.outputs.audit-service }}
      archive-service: ${{ steps.changes.outputs.archive-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            gateway:
              - 'gateway/**'
            trade-service:
              - 'trade-service/**'
            risk-service:
              - 'risk-service/**'
            clearing-service:
              - 'clearing-service/**'
            risk-engine:
              - 'risk-engine/**'
            audit-service:
              - 'audit-service/**'
            archive-service:
              - 'archive-service/**'

  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          # 只打 SHA tag，不再推 :latest（:latest 会在节点残留，被旧 RS 引用后 prune 删不掉）
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-gateway:${{ github.sha }} ./gateway
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-gateway:${{ github.sha }}

  build-trade-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.trade-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-trade-service:${{ github.sha }} ./trade-service
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-trade-service:${{ github.sha }}

  build-risk-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.risk-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-risk-service:${{ github.sha }} ./risk-service
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-risk-service:${{ github.sha }}

  build-clearing-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.clearing-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-clearing-service:${{ github.sha }} ./clearing-service
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-clearing-service:${{ github.sha }}

  build-risk-engine:
    needs: detect-changes
    if: needs.detect-changes.outputs.risk-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-risk-engine:${{ github.sha }} ./risk-engine
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-risk-engine:${{ github.sha }}

  build-audit-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.audit-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-audit-service:${{ github.sha }} ./audit-service
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-audit-service:${{ github.sha }}

  build-archive-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.archive-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        run: docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-archive-service:${{ github.sha }} ./archive-service
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ebpf-archive-service:${{ github.sha }}

  deploy:
    needs: [build-gateway, build-trade-service, build-risk-service, build-clearing-service, build-risk-engine, build-audit-service, build-archive-service]
    if: always() && !cancelled()
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/gh-runner/.kube/config
      # detect-changes outputs 通过 env 传入，shell 里判断是否更新镜像（只更新本次有构建的）
      GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.gateway }}
      TRADE_SERVICE_CHANGED: ${{ needs.detect-changes.outputs.trade-service }}
      RISK_SERVICE_CHANGED: ${{ needs.detect-changes.outputs.risk-service }}
      CLEARING_SERVICE_CHANGED: ${{ needs.detect-changes.outputs.clearing-service }}
      RISK_ENGINE_CHANGED: ${{ needs.detect-changes.outputs.risk-engine }}
      AUDIT_SERVICE_CHANGED: ${{ needs.detect-changes.outputs.audit-service }}
      ARCHIVE_SERVICE_CHANGED: ${{ needs.detect-changes.outputs.archive-service }}
    steps:
      - uses: actions/checkout@v4

      - name: Create acr-secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --namespace=ebpf-demo \
            --docker-server=${{ secrets.ACR_REGISTRY }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy all services
        run: |
          for f in k8s/gateway.yaml k8s/trade-service.yaml k8s/risk-service.yaml \
                   k8s/clearing-service.yaml k8s/risk-engine.yaml \
                   k8s/audit-service.yaml k8s/archive-service.yaml; do
            echo "Deploying $f..."
            kubectl apply -f "$f"
          done

      - name: Update images to commit SHA
        run: |
          # 用本次 commit SHA 覆盖 yaml 里的 digest 占位，确保每次部署拉到新镜像
          # 只更新本次有构建的镜像（避免给未构建的镜像 set 不存在的 SHA tag）
          REGISTRY=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}
          SHA=${{ github.sha }}

          # 服务名 -> 是否本次构建 (env 变量名 = 服务名大写连字符转下划线 + _CHANGED)
          update_if_changed() {
            local svc=$1
            local env_name=$(echo "$svc" | tr '[:lower:]-' '[:upper:]_')_CHANGED
            local changed="${!env_name}"
            if [ "$changed" = "true" ]; then
              echo "  $svc: 本次有构建，set image -> :$SHA"
              kubectl set image deployment/$svc -n ebpf-demo \
                app=$REGISTRY/ebpf-$svc:$SHA
            else
              echo "  $svc: 本次无构建，跳过"
            fi
          }

          for svc in gateway trade-service risk-service clearing-service risk-engine audit-service archive-service; do
            update_if_changed "$svc"
          done

      - name: Wait for rollout
        run: |
          for svc in gateway trade-service risk-service clearing-service risk-engine audit-service archive-service; do
            echo "Waiting for $svc..."
            kubectl rollout status deployment/$svc -n ebpf-demo --timeout=180s || true
          done

  # 镜像清理不在 CI 里做，由两节点各自的 cron 执行 /opt/scripts/prune-images.sh
  # （每天 3:17 清理本机 docker + k3s containerd 未使用镜像，见 k3s 笔记坑9.5）
